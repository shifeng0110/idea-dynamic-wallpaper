# Gradle 构建配置（不含任何本机绝对路径，公共仓库可安全提交）

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 禁止 Gradle 自动下载 JDK：只使用本机已安装的 JDK/JBR
org.gradle.java.installations.auto-download=false

# 编译工具链（JBR 25）路径通过环境变量 JBR_HOME 提供，
# 例如：JBR_HOME=E:\path\to\idea\jbr
org.gradle.java.installations.fromEnv=JBR_HOME

# ---- 代理（按需启用）----
